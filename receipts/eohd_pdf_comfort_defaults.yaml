from: markdown
to: pdf
pdf-engine: pdflatex
variables:
  geometry: margin=0.85in
  fontsize: 11pt
metadata:
  header-includes:
    - \usepackage{xcolor}
    - \usepackage{enumitem}
    - \setlist{nosep,leftmargin=1.5em}
    - \definecolor{calmblue}{HTML}{1F4E79}
    - \definecolor{softblue}{HTML}{2F6FA3}
    - \definecolor{linerule}{HTML}{D6DEE8}
    - \newcommand{\sectionrule}{\par\noindent\textcolor{linerule}{\rule{\linewidth}{0.35pt}}\par\vspace{0.25em}}
    - \setlength{\parskip}{0.4em}
