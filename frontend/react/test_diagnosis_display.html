<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Diagnosis Display</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .diagnosis-card { border: 1px solid #ddd; margin: 10px 0; padding: 15px; }
        .confidence-badge { display: inline-block; padding: 5px 10px; border-radius: 5px; color: white; }
        .detail-section { margin: 10px 0; }
        .icd-code { font-weight: bold; color: #007bff; }
    </style>
</head>
<body>
    <h1>Test Diagnosis Display Field Mapping</h1>
    
    <div class="test-section">
        <h2>Backend Response (Mock Data)</h2>
        <pre id="backend-response"></pre>
    </div>
    
    <div class="test-section">
        <h2>Frontend Transformation Result</h2>
        <pre id="transformation-result"></pre>
    </div>
    
    <div class="test-section">
        <h2>Rendered Diagnosis Cards</h2>
        <div id="diagnosis-cards"></div>
    </div>

    <script>
        // Mock backend response matching the actual structure
        const mockBackendResponse = {
            diagnoses: [
                {
                    diagnosis: "Chronic Fatigue Syndrome",
                    confidence_score: "High",
                    "ICD-10_code": "G93.3",
                    recommendations: "Further evaluation by a healthcare provider specializing in chronic fatigue syndrome for confirmation and management."
                },
                {
                    diagnosis: "Functional Gastrointestinal Disorder",
                    confidence_score: "Moderate",
                    "ICD-10_code": "K30",
                    recommendations: "Consider dietary modifications, stress management techniques, and consult with a gastroenterologist for further evaluation."
                },
                {
                    diagnosis: "Possible Cognitive Impairment",
                    confidence_score: "Low",
                    "ICD-10_code": "R41.82",
                    recommendations: "Further cognitive assessment by a healthcare provider specializing in cognitive disorders for evaluation."
                }
            ]
        };

        // Frontend transformation logic (copied from openaiService.js)
        const mapConfidenceToPercent = (confidenceStr) => {
            if (typeof confidenceStr === 'number') return confidenceStr;
            
            const confidenceMap = {
                'High': 90,
                'Moderate': 60,
                'Low': 30,
                'Unknown': 0
            };
            
            return confidenceMap[confidenceStr] || 0;
        };

        const getConfidenceColor = (confidence) => {
            if (confidence >= 80) return '#28a745'; // Green
            if (confidence >= 60) return '#ffc107'; // Yellow
            return '#dc3545'; // Red
        };

        // Transform the data using the new field mapping
        const transformedData = mockBackendResponse.diagnoses.map(diagnosis => ({
            name: diagnosis.diagnosis || 'Unknown Condition',
            confidence: mapConfidenceToPercent(diagnosis.confidence_score),
            explanation: diagnosis.recommendations || '',
            icd10Code: diagnosis['ICD-10_code'] || '',
            symptoms: diagnosis.explanation ? [diagnosis.explanation] : [],
            redFlags: Array.isArray(diagnosis.redFlags) ? diagnosis.redFlags : [],
            labSuggestions: Array.isArray(diagnosis.labSuggestions) ? diagnosis.labSuggestions : []
        }));

        // Display the results
        document.getElementById('backend-response').textContent = JSON.stringify(mockBackendResponse, null, 2);
        document.getElementById('transformation-result').textContent = JSON.stringify(transformedData, null, 2);

        // Render diagnosis cards
        const cardsContainer = document.getElementById('diagnosis-cards');
        transformedData.forEach((diagnosis, index) => {
            const card = document.createElement('div');
            card.className = 'diagnosis-card';
            
            card.innerHTML = `
                <div class="diagnosis-header">
                    <h3>${diagnosis.name}</h3>
                    <div class="confidence-badge" style="background-color: ${getConfidenceColor(diagnosis.confidence)}">
                        ${diagnosis.confidence}% confidence
                    </div>
                </div>
                
                ${diagnosis.explanation ? `
                    <div class="detail-section">
                        <h4>Recommendations</h4>
                        <p>${diagnosis.explanation}</p>
                    </div>
                ` : ''}
                
                ${diagnosis.icd10Code ? `
                    <div class="detail-section">
                        <h4>ICD-10 Code</h4>
                        <p class="icd-code">${diagnosis.icd10Code}</p>
                    </div>
                ` : ''}
            `;
            
            cardsContainer.appendChild(card);
        });

        // Test results
        console.log('=== DIAGNOSIS DISPLAY TEST RESULTS ===');
        console.log('Backend Response:', mockBackendResponse);
        console.log('Transformed Data:', transformedData);
        
        // Validation checks
        const validationResults = [];
        transformedData.forEach((diagnosis, index) => {
            const original = mockBackendResponse.diagnoses[index];
            
            validationResults.push({
                index,
                nameMapping: diagnosis.name === original.diagnosis ? '✅' : '❌',
                confidenceMapping: diagnosis.confidence === mapConfidenceToPercent(original.confidence_score) ? '✅' : '❌',
                icd10Mapping: diagnosis.icd10Code === original['ICD-10_code'] ? '✅' : '❌',
                recommendationsMapping: diagnosis.explanation === original.recommendations ? '✅' : '❌'
            });
        });
        
        console.log('Validation Results:', validationResults);
        
        // Summary
        const allValid = validationResults.every(result => 
            result.nameMapping === '✅' && 
            result.confidenceMapping === '✅' && 
            result.icd10Mapping === '✅' && 
            result.recommendationsMapping === '✅'
        );
        
        console.log(allValid ? '🎉 ALL FIELD MAPPINGS WORKING CORRECTLY!' : '❌ SOME FIELD MAPPINGS FAILED');
    </script>
</body>
</html>
