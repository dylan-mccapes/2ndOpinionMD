<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>2ndOpinionMD · Guideline Q&A Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; padding: 1.5rem; background: #0f172a; color: #e5e7eb; }
    h1 { margin-bottom: 0.5rem; font-size: 1.5rem; }
    .subtitle { color: #9ca3af; margin-bottom: 1.5rem; }
    .card {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 0.75rem;
      padding: 1.5rem;
      border: 1px solid #1f2937;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.5);
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 0.75rem; }
    .row label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: #9ca3af; }
    .input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid #1f2937;
      background: #020617;
      color: #f9fafb;
      font-size: 0.9rem;
    }
    .input:focus {
      outline: 2px solid #38bdf8;
      outline-offset: 1px;
      border-color: #38bdf8;
    }
    textarea.input { min-height: 4.5rem; resize: vertical; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; align-items: center; }
    .pill {
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.8rem;
      cursor: default;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }
    .pill.active {
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      border-color: transparent;
      color: #020617;
    }
    .pill span.mode-label { font-weight: 600; }
    .pill small { opacity: 0.8; }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .btn {
      border: none;
      border-radius: 999px;
      padding: 0.6rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      color: #020617;
    }
    .btn-secondary {
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #1f2937;
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .status {
      font-size: 0.8rem;
      color: #9ca3af;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .status-dot {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 999px;
      background: #4b5563;
    }
    .status-dot.live { background: #22c55e; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2); }
    .status-dot.error { background: #ef4444; box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.2); }
    .columns {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
    .panel {
      background: #020617;
      border-radius: 0.75rem;
      border: 1px solid #1f2937;
      padding: 0.75rem;
      min-height: 200px;
      font-size: 0.85rem;
      max-height: 500px;
      overflow-y: auto;
    }
    .panel h2 {
      margin: 0 0 0.5rem;
      font-size: 0.9rem;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: #020617;
      padding-bottom: 0.5rem;
      z-index: 1;
    }
    .panel h2 span.tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
      border: 1px solid #1f2937;
      color: #9ca3af;
    }
    .pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: ui-monospace, Menlo, Monaco, "SF Mono", monospace;
      color: #e5e7eb;
    }
    .meta-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.25rem;
      font-size: 0.8rem;
    }
    .meta-table th, .meta-table td {
      border-bottom: 1px solid #1f2937;
      padding: 0.25rem 0;
      text-align: left;
    }
    .meta-table th { color: #9ca3af; font-weight: 500; }
    .meta-table td:last-child { text-align: right; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      border: 1px solid #1f2937;
      color: #9ca3af;
    }
    a { color: #38bdf8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    /* Raw events panel */
    .raw-events-panel {
      margin-top: 0.75rem;
      background: #020617;
      border-radius: 0.75rem;
      border: 1px solid #1f2937;
      padding: 0.75rem;
    }
    .raw-events-panel h2 {
      margin: 0 0 0.5rem;
      font-size: 0.9rem;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .raw-events-panel h2:hover {
      color: #38bdf8;
    }
    .raw-events-panel .toggle-icon {
      font-size: 0.8rem;
      transition: transform 0.2s;
    }
    .raw-events-panel.collapsed .toggle-icon {
      transform: rotate(-90deg);
    }
    .raw-events-panel.collapsed .raw-events-content {
      display: none;
    }
    .raw-events-content {
      max-height: 400px;
      overflow-y: auto;
      font-family: ui-monospace, Menlo, Monaco, "SF Mono", monospace;
      font-size: 0.75rem;
      color: #9ca3af;
      background: #0a0a0f;
      border-radius: 0.5rem;
      padding: 0.5rem;
    }
    
    @media (max-width: 768px) {
      body { padding: 0.75rem; }
      .card { padding: 1rem; }
      .columns { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>2ndOpinionMD · Guideline Q&A Demo</h1>
    <div class="subtitle">
      Inspect guideline retrieval, QA grading, and answer streaming from <code>/api/rag/ask_stream</code>.
    </div>

    <div class="row">
      <label for="query">Clinical question</label>
      <textarea
        id="query"
        class="input"
        placeholder="e.g. In a 32-year-old woman with seropositive RA, mild RA-ILD, and pregnancy plans in 1-2 years, summarize guideline-based csDMARD/biologic sequencing."
      ></textarea>
    </div>

    <div class="pill-row">
      <span class="pill active">
        <span class="mode-label">Guideline Q&A</span>
        <small>/ask_stream</small>
      </span>

      <span class="badge">
        <span style="width:0.5rem;height:0.5rem;border-radius:999px;background:#22c55e;margin-right:0.35rem;"></span>
        streaming SSE
      </span>
    </div>

    <div class="button-row">
      <div>
        <button id="run-btn" class="btn btn-primary" type="button">
          <span>&#9654;</span> Run query
        </button>
        <button id="clear-btn" class="btn btn-secondary" type="button">
          Clear
        </button>
      </div>
      <div class="status">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Idle</span>
      </div>
    </div>

    <div class="columns">
      <div class="panel">
        <h2>
          Context & Matches
          <span class="tag">retrieval & routing</span>
        </h2>
        <div id="matches" class="pre">No results yet.</div>
      </div>
      <div class="panel">
        <h2>
          LLM Answer
          <span class="tag">generation</span>
        </h2>
        <div id="answer" class="pre">No answer yet.</div>
        <table class="meta-table" id="meta-table" style="display:none;">
          <thead>
            <tr>
              <th>Metric</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody id="meta-body"></tbody>
        </table>
      </div>
    </div>

    <div class="raw-events-panel" id="raw-events-panel">
      <h2 id="raw-events-toggle">
        Raw SSE Events
        <span class="toggle-icon">&#9660;</span>
      </h2>
      <pre class="raw-events-content" id="raw-events"></pre>
    </div>
  </div>

  <script>
    // === CONFIG: point UI at the real backend ============================
    const API_BASE = "https://2ndopinionmd.ai";
    // const API_BASE = "http://localhost:8000";

    const runBtn    = document.getElementById("run-btn");
    const clearBtn  = document.getElementById("clear-btn");
    const queryEl   = document.getElementById("query");
    const matchesEl = document.getElementById("matches");
    const answerEl  = document.getElementById("answer");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const metaTable = document.getElementById("meta-table");
    const metaBody  = document.getElementById("meta-body");
    const rawEventsEl = document.getElementById("raw-events");
    const rawEventsPanel = document.getElementById("raw-events-panel");
    const rawEventsToggle = document.getElementById("raw-events-toggle");

    let currentSourceStats = { ts: 0, ann: 0, valyu: 0, fused: 0 };
    let currentEventSource = null;

    // Toggle raw events panel
    rawEventsToggle.addEventListener("click", () => {
      rawEventsPanel.classList.toggle("collapsed");
    });

    function setStatus(text, state) {
      statusText.textContent = text;
      statusDot.classList.remove("live", "error");
      if (state === "live") statusDot.classList.add("live");
      if (state === "error") statusDot.classList.add("error");
    }

    function resetOutput() {
      matchesEl.textContent = "No results yet.";
      answerEl.textContent = "No answer yet.";
      rawEventsEl.textContent = "";
      currentSourceStats = { ts: 0, ann: 0, valyu: 0, fused: 0 };
      metaBody.innerHTML = "";
      metaTable.style.display = "none";
    }

    function appendMatchesBlock(block) {
      const existing = matchesEl.textContent === "No results yet."
        ? ""
        : matchesEl.textContent + "\n\n";
      matchesEl.textContent = existing + block;
      matchesEl.scrollTop = matchesEl.scrollHeight;
    }

    // Log raw SSE events to the raw events panel
    function logEventRaw(type, dataText) {
      const ts = new Date().toISOString().slice(11, 19); // HH:MM:SS
      let block = `--- [${ts}] event=${type} ---\n`;
      try {
        const parsed = JSON.parse(dataText);
        block += JSON.stringify(parsed, null, 2);
      } catch {
        block += dataText;
      }
      block += "\n\n";
      rawEventsEl.textContent += block;
      rawEventsEl.scrollTop = rawEventsEl.scrollHeight;
    }

    clearBtn.addEventListener("click", () => {
      queryEl.value = "";
      resetOutput();
      setStatus("Idle", null);
      if (currentEventSource) {
        currentEventSource.close();
        currentEventSource = null;
      }
    });

    runBtn.addEventListener("click", () => {
      const q = queryEl.value.trim();
      if (!q) {
        alert("Please enter a clinical question.");
        return;
      }

      // Close any existing EventSource
      if (currentEventSource) {
        currentEventSource.close();
        currentEventSource = null;
      }

      resetOutput();
      runBtn.disabled = true;
      setStatus("Embedding & retrieving...", "live");

      const endpoint = "/api/rag/ask_stream";

      const params = new URLSearchParams({
        q,
        limit: "8",
        ctx_k: "24",
        with_llm: "1",
        llm_mode: "chunk",
        use_valyu: "1",
        valyu_k: "3",
        valyu_mode: "search",
        valyu_raw: "1",
      });

      const url = `${API_BASE}${endpoint}?${params.toString()}`;
      const es = new EventSource(url);
      currentEventSource = es;

      let answerText = "";

      // === SSE Event Handlers ===

      // Helper to register event listener with raw logging
      function on(eventName, handler) {
        es.addEventListener(eventName, (ev) => {
          logEventRaw(eventName, ev.data);
          if (handler) {
            try {
              handler(ev);
            } catch (e) {
              console.error(`Error in handler for ${eventName}:`, e);
            }
          }
        });
      }

      // --- start ---
      on("start", (ev) => {
        const data = JSON.parse(ev.data);
        const srcs = Array.isArray(data.sources) ? data.sources.join(", ") : "(not specified)";
        matchesEl.textContent =
          `Query: ${data.q}\nSources: ${srcs}\nValyu: ${data.use_valyu ? "enabled" : "disabled"}\n\nAwaiting matches...`;
      });

      // --- warning ---
      on("warning", (ev) => {
        const data = JSON.parse(ev.data);
        let msgs = data.messages || data.warning || [];
        if (!Array.isArray(msgs)) msgs = [String(msgs)];
        if (!msgs.length) return;
        appendMatchesBlock(
          "Warning:\n" + msgs.map(m => `  - ${m}`).join("\n")
        );
        setStatus("Warning: " + msgs[0], "live");
      });

      // --- query_terms ---
      on("query_terms", (ev) => {
        const data = JSON.parse(ev.data);
        const terms = data.terms || [];
        const expansions = data.expansions || {};
        const allTerms = data.all_terms || [];

        if (!terms.length && !Object.keys(expansions).length && !allTerms.length) return;

        const lines = [];
        if (terms.length) {
          lines.push("Terms: " + terms.join(", "));
        }
        const expKeys = Object.keys(expansions);
        if (expKeys.length) {
          lines.push("Expansions:");
          expKeys.forEach(k => {
            const vals = expansions[k] || [];
            if (vals.length) {
              lines.push(`  - ${k}: ${vals.join(", ")}`);
            }
          });
        }
        if (allTerms.length) {
          lines.push("All terms: " + allTerms.join(", "));
        }

        appendMatchesBlock("Extracted Query Terms\n" + lines.join("\n"));
      });

      // --- router ---
      on("router", (ev) => {
        const data = JSON.parse(ev.data);
        const taskType = data.task_type || "(unknown)";
        const selected = Array.isArray(data.selected_sources)
          ? data.selected_sources.join(", ")
          : "(none)";
        const reasoning = data.reasoning || "";
        appendMatchesBlock(
          "Router Plan\n" +
          `  Task type: ${taskType}\n` +
          `  Selected sources: ${selected}\n` +
          (reasoning ? `  Reasoning:\n${reasoning}` : "")
        );
      });

      // --- event_router_summary ---
      on("event_router_summary", (ev) => {
        const data = JSON.parse(ev.data);
        const mode = data.mode || "";
        const effective = Array.isArray(data.effective_sources)
          ? data.effective_sources.join(", ")
          : "(none)";
        appendMatchesBlock(
          "Router Summary\n" +
          `  Mode: ${mode}\n` +
          `  Effective sources: ${effective}`
        );
      });

      // --- qa_ledger ---
      on("qa_ledger", (ev) => {
        const data = JSON.parse(ev.data);
        appendMatchesBlock(
          "QA Ledger\n" + JSON.stringify(data.summary || data, null, 2)
        );
      });

      // --- qa_grader ---
      on("qa_grader", (ev) => {
        const data = JSON.parse(ev.data);
        appendMatchesBlock(
          "QA Grader\n" + JSON.stringify(data, null, 2)
        );
      });

      // --- gating ---
      on("gating", (ev) => {
        const data = JSON.parse(ev.data);
        appendMatchesBlock(
          "Gating Summary\n" + JSON.stringify(data, null, 2)
        );
      });

      // --- phase_start ---
      on("phase_start", (ev) => {
        const data = JSON.parse(ev.data);
        const src = data.source || "(unknown)";
        const method = data.method || "(unknown)";
        appendMatchesBlock(
          `Phase start - source=${src}, method=${method}`
        );
      });

      // --- phase_end ---
      on("phase_end", (ev) => {
        const data = JSON.parse(ev.data);
        const src = data.source || "(unknown)";
        const method = data.method || "(unknown)";
        appendMatchesBlock(
          `Phase end   - source=${src}, method=${method}`
        );
      });

      // --- matches ---
      on("matches", (ev) => {
        const data = JSON.parse(ev.data);
        const phase  = data.phase;
        const rows   = data.matches || [];
        const src    = data.source || "(unknown)";
        currentSourceStats[phase] = (currentSourceStats[phase] || 0) + rows.length;

        const header = `Phase: ${phase.toUpperCase()} - Source: ${src} (${rows.length} matches)`;
        const lines = rows.slice(0, 10).map((r, idx) => {
          const hasId = r.source_id && r.source_id !== "";
          const idLabel =
            r.source === "rxnorm"
              ? `CUI: ${r.source_id}`
              : hasId
              ? `ID: ${r.source_id}`
              : null;

          const idPart = idLabel ? `  (${idLabel})` : "";
          const scoreVal = typeof r.score === "number" ? r.score : 0;
          const method = r.method ? ` [${r.method}]` : "";
          return `  [${idx + 1}] ${r.source} :: ${r.title || "(no title)"}${idPart} (score=${scoreVal.toFixed(3)})${method}`;
        });

        if (rows.length > 10) {
          lines.push(`  ... and ${rows.length - 10} more`);
        }

        appendMatchesBlock(header + "\n" + lines.join("\n"));

        if (phase === "fused") {
          setStatus("Fused context ready - waiting on LLM...", "live");
        }
      });

      // --- valyu_fulltext ---
      on("valyu_fulltext", (ev) => {
        const data = JSON.parse(ev.data);
        const rows = data.rows || [];
        const k = data.k;
        const mode = data.mode;
        const lines = rows.map((r, idx) => {
          return `  [${idx + 1}] ${r.title || r.id} (url=${r.url || "N/A"})`;
        });
        appendMatchesBlock(
          "Valyu Fulltext\n" +
          `  k=${k}, mode=${mode}\n` +
          lines.join("\n")
        );
      });

      // --- valyu_fulltext_ctx ---
      on("valyu_fulltext_ctx", (ev) => {
        const data = JSON.parse(ev.data);
        const rows = data.rows || [];
        const k = data.k;
        const mode = data.mode;
        const lines = rows.map((r, idx) => {
          return `  [${idx + 1}] ${r.title || r.id} (len=${r.len_text}, has_fulltext=${r.has_fulltext})`;
        });
        appendMatchesBlock(
          "Valyu Fulltext Context\n" +
          `  k=${k}, mode=${mode}\n` +
          lines.join("\n")
        );
      });

      // --- llm_chunk ---
      on("llm_chunk", (ev) => {
        const data = JSON.parse(ev.data);
        answerText += data.text || "";
        answerEl.textContent = answerText;
        setStatus("Streaming answer...", "live");
      });

      // --- llm_delta (backwards compat) ---
      on("llm_delta", (ev) => {
        const data = JSON.parse(ev.data);
        answerText += data.text || "";
        answerEl.textContent = answerText;
        setStatus("Streaming answer...", "live");
      });

      // --- llm_done ---
      on("llm_done", (ev) => {
        const data = JSON.parse(ev.data);
        if (data.text) {
          answerText = data.text;
          answerEl.textContent = answerText;
        }
      });

      // --- valyu_llm_chunk ---
      on("valyu_llm_chunk", (ev) => {
        const data = JSON.parse(ev.data);
        const text = data.text || "";
        appendMatchesBlock("Valyu Evidence Summary (chunk)\n" + text);
        setStatus("Streaming Valyu evidence...", "live");
      });

      // --- valyu_llm_done ---
      on("valyu_llm_done", (ev) => {
        const data = JSON.parse(ev.data);
        const text = data.text || "";
        appendMatchesBlock("Valyu Evidence Summary (final)\n" + text);
      });

      // --- citations ---
      on("citations", (ev) => {
        const data = JSON.parse(ev.data);
        const cits = data.citations || [];
        if (!cits.length) return;

        metaBody.innerHTML = "";
        const groups = { valyu: 0, ethos: 0, guideline: 0 };
        cits.forEach(c => { 
          const kind = c.kind || "guideline";
          groups[kind] = (groups[kind] || 0) + 1; 
        });

        const rows = [
          ["Valyu citations", groups.valyu || 0],
          ["Ethos citations", groups.ethos || 0],
          ["Guideline/other citations", groups.guideline || 0],
          ["TS matches", currentSourceStats.ts || 0],
          ["ANN matches", currentSourceStats.ann || 0],
          ["Valyu matches", currentSourceStats.valyu || 0],
          ["Fused context items", currentSourceStats.fused || 0],
        ];

        rows.forEach(([label, value]) => {
          const tr = document.createElement("tr");
          const td1 = document.createElement("td");
          const td2 = document.createElement("td");
          td1.textContent = label;
          td2.textContent = String(value);
          tr.appendChild(td1);
          tr.appendChild(td2);
          metaBody.appendChild(tr);
        });

        metaTable.style.display = "";
      });

      // --- status ---
      on("status", (ev) => {
        const data = JSON.parse(ev.data);
        const s = data.status;
        const detail = data.detail || "";
        
        const statusMap = {
          "embedding_query": "Embedding query...",
          "extracting_query_terms": "Extracting query terms...",
          "extracting_terms": "Extracting terms...",
          "routing_sources": "Routing sources...",
          "retrieving_candidates": "Retrieving candidates...",
          "ts_error": `TS error: ${data.source || ""}`,
          "ann_error": `ANN error: ${data.source || ""}`,
          "valyu_fetch": "Fetching Valyu evidence...",
          "valyu_error": "Valyu fetch error...",
          "fusing_context": "Fusing context...",
          "generating_answer": "Generating answer...",
          "generating_valyu_answer": "Generating Valyu evidence summary...",
          "done_no_llm": "Done (retrieval only).",
        };

        const statusLabel = statusMap[s] || (detail ? `${s}: ${detail}` : s);
        if (statusLabel) {
          setStatus(statusLabel, "live");
        }
      });

      // --- error ---
      on("error", (ev) => {
        const data = JSON.parse(ev.data);
        const errorType = data.error || "unknown";
        const detail = data.detail || "";
        appendMatchesBlock(
          `Error: ${errorType}\n${detail ? `  Detail: ${detail}` : ""}`
        );
        setStatus(`Error: ${errorType}`, "error");
      });

      // --- end ---
      on("end", (ev) => {
        const data = JSON.parse(ev.data);
        const meta = data.meta || {};
        
        appendMatchesBlock(
          "Stream Complete\n" +
          `  Sources (raw): ${meta.n_sources_raw || 0}\n` +
          `  Sources (gated): ${meta.n_sources || 0}\n` +
          `  Context (internal): ${meta.n_ctx_internal || 0}\n` +
          `  Context (valyu): ${meta.n_ctx_valyu || 0}\n` +
          `  Context (total): ${meta.n_ctx_total || 0}`
        );
        
        setStatus("Completed.", null);
        es.close();
        currentEventSource = null;
        runBtn.disabled = false;
      });

      // --- EventSource error handler ---
      es.onerror = (ev) => {
        logEventRaw("onerror", JSON.stringify({ type: "connection_error" }));
        setStatus("Error during streaming (see console).", "error");
        console.error("RAG stream error:", ev);
        es.close();
        currentEventSource = null;
        runBtn.disabled = false;
      };

      // --- EventSource open handler ---
      es.onopen = () => {
        logEventRaw("onopen", JSON.stringify({ type: "connection_opened" }));
      };
    });
  </script>
</body>
</html>
