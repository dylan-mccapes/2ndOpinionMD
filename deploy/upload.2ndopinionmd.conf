server {
  listen 9443 ssl;
  server_name upload.2ndopinionmd.ai;

  ssl_certificate     /etc/letsencrypt/live/upload.2ndopinionmd.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/upload.2ndopinionmd.ai/privkey.pem;

  client_max_body_size 500M;

  # Only expose timeline upload endpoints
  location /api/timeline/ {
    proxy_pass http://127.0.0.1:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 14400s;
    proxy_send_timeout 14400s;
    add_header Cache-Control "no-cache";

    proxy_request_buffering off;
  }

  location / {
    return 404;
  }

  location ~ /\.(env|git) {
    deny all;
    return 404;
  }
}

server {
  listen 80;
  server_name upload.2ndopinionmd.ai;
  return 301 https://$host:9443$request_uri;
}
